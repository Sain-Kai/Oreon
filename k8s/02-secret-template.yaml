# TEMPLATE ONLY - do not commit real values in this file.
# Preferred approach: create the secret imperatively instead of editing this file:
#
#   kubectl create secret generic rag-platform-secrets -n rag-platform \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=NVIDIA_API_KEY='...' \
#     --from-literal=OPENROUTER_API_KEY='...' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)"
#
# For a real cluster, look at Sealed Secrets or External Secrets Operator instead of plain
# Kubernetes Secrets (which are only base64-encoded, not encrypted, at rest by default).
apiVersion: v1
kind: Secret
metadata:
  name: rag-platform-secrets
  namespace: rag-platform
type: Opaque
stringData:
  DB_PASSWORD: "changeme"
  NVIDIA_API_KEY: "changeme"
  OPENROUTER_API_KEY: "changeme"
  JWT_SECRET: "changeme"

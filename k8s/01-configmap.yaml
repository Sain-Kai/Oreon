apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-platform-config
  namespace: rag-platform
data:
  DB_URL: "jdbc:postgresql://postgres:5432/ragdb"
  DB_USERNAME: "raguser"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  NVIDIA_CHAT_MODEL: "meta/llama-3.1-70b-instruct"
  OPENROUTER_EMBEDDING_MODEL: "nvidia/nemotron-3-embed-1b:free"
  OPENROUTER_FALLBACK_CHAT_MODEL: "z-ai/glm-5.2:free"
  EMBEDDING_DIMENSIONS: "2048"
  RATE_LIMIT_RPM: "20"

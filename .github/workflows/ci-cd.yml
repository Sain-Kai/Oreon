name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Testcontainers needs Docker, which ubuntu-latest runners already have available
      - name: Run tests
        run: mvn -B verify

  build-and-push-image:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rag-platform:latest
            ghcr.io/${{ github.repository_owner }}/rag-platform:${{ github.sha }}

  deploy-render:
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Render project settings -> the service's "Deploy Hook" URL, saved as a repo secret.
      # This is the realistic path to a publicly reachable live demo (see the k8s job below for why).
      - name: Trigger Render deploy
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # Optional: only relevant if you actually have a Kubernetes cluster (kind/minikube for local
  # demonstration, or a real cloud cluster) with its kubeconfig saved as the KUBECONFIG secret below.
  # Render itself does not run raw Kubernetes, so this job is for demonstrating the k8s deployment
  # path separately from the live public demo, not for replacing the Render deploy above.
